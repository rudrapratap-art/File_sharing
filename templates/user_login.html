<!DOCTYPE html>
<html>
<head>
<title>User Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    background:#0f172a;
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
    width:320px;
    padding:25px;
    border-radius:10px;
    text-align:center;
}

input{
    width:90%;
    padding:8px;
    margin:8px 0;
}

button{
    width:95%;
    padding:8px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
}

</style>
</head>

<body>

<div class="card">

<h2>👤 User Login</h2>

<form method="POST">

<input name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button>Login</button>

</form>

<p style="color:red">{{ msg }}</p>

<a href="/register">Create Account</a>

</div>

</body>
</html>
