<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            margin:0;
            font-family:"Segoe UI", Arial, sans-serif;
            background:linear-gradient(to right,#0f172a,#1e293b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        /* Card */

        .login-card{
            background:white;
            width:350px;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
            text-align:center;
        }

        .login-card h2{
            margin-bottom:20px;
            color:#1e293b;
        }

        /* Inputs */

        .login-card input{
            width:90%;
            padding:10px;
            margin:10px 0;
            border-radius:6px;
            border:1px solid #ccc;
            font-size:15px;
        }

        .login-card input:focus{
            outline:none;
            border-color:#38bdf8;
        }

        /* Button */

        .login-card button{
            width:95%;
            padding:10px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
            margin-top:15px;
        }

        .login-card button:hover{
            background:#1d4ed8;
        }

        /* Message */

        .msg{
            margin-top:10px;
            color:red;
            font-weight:500;
        }

        /* Back Link */

        .back{
            margin-top:15px;
            display:block;
            color:#2563eb;
            text-decoration:none;
            font-size:14px;
        }

        .back:hover{
            text-decoration:underline;
        }

    </style>
</head>

<body>


<div class="login-card">

    <h2>🔐 Admin Login</h2>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>

    </form>


    {% if msg %}
        <div class="msg">{{ msg }}</div>
    {% endif %}


    <a href="/" class="back">← Back to Home</a>

</div>


</body>
</html>
